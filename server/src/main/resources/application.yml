spring:
  application:
    name: chat-server
  datasource:
    url: ${CHAT_DB_URL:}
    username: ${CHAT_DB_USERNAME:}
    password: ${CHAT_DB_PASSWORD:}
  flyway:
    enabled: ${CHAT_DB_MIGRATIONS_ENABLED:false}
    locations: classpath:db/migration

server:
  port: ${CHAT_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.nafiz.server: INFO
